services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zirologistics_wms
      MYSQL_USER: ${WMS_DB_USERNAME:?Set WMS_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - zirologistics_wms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WMS_DB_URL: jdbc:mysql://mysql:3306/zirologistics_wms
      WMS_DB_USERNAME: ${WMS_DB_USERNAME:?Set WMS_DB_USERNAME in .env}
      WMS_DB_PASSWORD: ${WMS_DB_PASSWORD:?Set WMS_DB_PASSWORD in .env}
      WMS_FLYWAY_ENABLED: ${WMS_FLYWAY_ENABLED:?Set WMS_FLYWAY_ENABLED in .env}
      WMS_CORS_ALLOWED_ORIGINS: ${WMS_CORS_ALLOWED_ORIGINS:-}
      WMS_JWT_ENABLED: ${WMS_JWT_ENABLED:-false}
      WMS_SECURITY_HTTP_AUTH_ENDPOINTS_ENABLED: ${WMS_SECURITY_HTTP_AUTH_ENDPOINTS_ENABLED:-false}
      WMS_JWT_ISSUER: ${WMS_JWT_ISSUER:-https://zirologistics.local}
      WMS_JWT_SELECTION_AUDIENCE: ${WMS_JWT_SELECTION_AUDIENCE:-zirologistics-wms-selection}
      WMS_JWT_ACCESS_AUDIENCE: ${WMS_JWT_ACCESS_AUDIENCE:-zirologistics-wms-access}
      WMS_JWT_KEY_ID: ${WMS_JWT_KEY_ID:-local-disabled}
      WMS_JWT_PUBLIC_KEY_PEM: ${WMS_JWT_PUBLIC_KEY_PEM:-}
      WMS_JWT_PRIVATE_KEY_PEM: ${WMS_JWT_PRIVATE_KEY_PEM:-}
      WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_ENABLED: ${WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_ENABLED:-false}
      WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_CURRENT_KEY_VERSION: ${WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_CURRENT_KEY_VERSION:-0}
      WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_KEYS_1: ${WMS_IDENTITY_EMAIL_OUTBOX_ENCRYPTION_KEYS_1:-}
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  zirologistics_wms_mysql_data:
