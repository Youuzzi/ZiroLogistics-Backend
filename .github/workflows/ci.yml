name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Main pushes and manual runs always execute the full regression suite.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR event base SHA can be stale while the synthetic merge ref is current.
          # Compare the PR head against the current base's merge-base, not github.sha,
          # so base-branch commits do not make documentation-only PRs run full Maven.
          if ! git fetch --no-tags origin "$BASE_REF"; then
            echo "Could not fetch current base ref; defaulting to full backend validation."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! merge_base="$(git merge-base FETCH_HEAD "$PR_HEAD_SHA")"; then
            echo "Could not find merge-base; defaulting to full backend validation."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$merge_base" "$PR_HEAD_SHA")"
          if [[ -z "$changed_files" ]]; then
            echo "No changed files detected; defaulting to full backend validation."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "diff_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "diff_head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

          docs_only=true
          while IFS= read -r file; do
            if [[ "$file" == docs/* && "$file" =~ \.(md|mdx|rst|txt)$ ]] || [[ "$file" =~ ^(README|CONTRIBUTING|CHANGELOG)\.md$ ]]; then
              continue
            else
              docs_only=false
              break
            fi
          done <<< "$changed_files"

          if [[ "$docs_only" == "true" ]]; then
            echo "Documentation-only PR detected."
            echo "run_backend_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backend-relevant changes detected; full regression is required."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate documentation diff
        if: steps.scope.outputs.run_backend_tests == 'false'
        env:
          DIFF_BASE: ${{ steps.scope.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.scope.outputs.diff_head }}
        run: git diff --check "$DIFF_BASE" "$DIFF_HEAD"

      - name: Set up Java
        if: steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate WMS Compose configuration
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: docker compose --env-file .env.example -f compose.yml config --quiet

      - name: Capture resolved Maven dependency tree
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: mvn --settings .docker/maven/settings.xml --batch-mode --no-transfer-progress dependency:tree -Dverbose -DoutputFile=dependency-tree.txt

      - name: Run full regression and package WMS runtime
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: mvn --settings .docker/maven/settings.xml --batch-mode --no-transfer-progress -Pwms-runtime clean verify

      - name: Upload resolved dependency tree
        if: always() && steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wms-maven-dependency-tree
          path: dependency-tree.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JaCoCo coverage report
        if: always() && steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wms-jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify packaged WMS entry point
        if: steps.scope.outputs.run_backend_tests == 'true'
        shell: bash
        run: |
          start_class="$(unzip -p target/zirologistics-0.0.1-SNAPSHOT.jar META-INF/MANIFEST.MF | sed -n 's/^Start-Class: //p' | tr -d '\r')"
          test "$start_class" = "com.zirocraft.zirologistics.wms.WmsRuntimeApplication"

      - name: Build WMS Docker image
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: docker build --pull --tag zirologistics-wms:ci --file Dockerfile .

  dependency-vulnerability-scan:
    name: Dependency vulnerability scan (OSV)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
