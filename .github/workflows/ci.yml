name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Main pushes and manual runs always execute the full regression suite.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -z "$changed_files" ]]; then
            echo "No changed files detected; defaulting to full backend validation."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r file; do
            if [[ "$file" == docs/* && "$file" =~ \.(md|mdx|rst|txt)$ ]] || [[ "$file" =~ ^(README|CONTRIBUTING|CHANGELOG)\.md$ ]]; then
              continue
            else
              docs_only=false
              break
            fi
          done <<< "$changed_files"

          if [[ "$docs_only" == "true" ]]; then
            echo "Documentation-only PR detected."
            echo "run_backend_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "Backend-relevant changes detected; full regression is required."
            echo "run_backend_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate documentation diff
        if: steps.scope.outputs.run_backend_tests == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Set up Java
        if: steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restore OWASP Dependency-Check database cache
        if: steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-

      - name: Make Maven Wrapper executable
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: chmod +x mvnw

      - name: Validate WMS Compose configuration
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: docker compose --env-file .env.example -f compose.yml config --quiet

      - name: Run full regression and package WMS runtime
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -Pwms-runtime clean verify

      - name: Upload JaCoCo coverage report
        if: always() && steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wms-jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency vulnerability report
        if: always() && steps.scope.outputs.run_backend_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wms-dependency-vulnerability-report
          path: target/dependency-check-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify packaged WMS entry point
        if: steps.scope.outputs.run_backend_tests == 'true'
        shell: bash
        run: |
          start_class="$(unzip -p target/zirologistics-0.0.1-SNAPSHOT.jar META-INF/MANIFEST.MF | sed -n 's/^Start-Class: //p' | tr -d '\r')"
          test "$start_class" = "com.zirocraft.zirologistics.wms.WmsRuntimeApplication"

      - name: Build WMS Docker image
        if: steps.scope.outputs.run_backend_tests == 'true'
        run: docker build --pull --tag zirologistics-wms:ci --file Dockerfile .