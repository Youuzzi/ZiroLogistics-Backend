name: Backend CI

on:
  push:
    branches:
      - main
      - audit/backend-hardening
  pull_request:
    branches:
      - main
      - audit/backend-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
