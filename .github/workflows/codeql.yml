name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Use the runner-provided Maven executable instead of the Maven Wrapper.
      # CodeQL autobuild invokes ./mvnw, which must download its Maven distribution
      # before extraction can begin; a transient Maven Central outage then prevents
      # CodeQL from analyzing otherwise buildable source.
      - name: Build for CodeQL analysis
        run: mvn --batch-mode --no-transfer-progress -Pwms-runtime -DskipTests package

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          output: codeql-sarif

      - name: Archive CodeQL SARIF for security review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms-codeql-sarif
          path: codeql-sarif
          if-no-files-found: warn
          retention-days: 30
