spring.application.name=zirologistics

# Database Configuration (Full Abstract)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Safe defaults: do not mutate the schema or print SQL in normal deployments.
# Set JPA_DDL_AUTO=update only for local development when schema auto-update is needed.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT Security
ziro.jwt.secret=${JWT_SECRET_KEY}

# Flyway is opt-in until an isolated database is explicitly configured.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
