spring.datasource.url=${WMS_DB_URL}
spring.datasource.username=${WMS_DB_USERNAME}
spring.datasource.password=${WMS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${WMS_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/wms-migration

# CORS is deny-by-default until explicit frontend origins are configured.
wms.security.cors.allowed-origins=${WMS_CORS_ALLOWED_ORIGINS:}

# JWT beans stay disabled until explicitly enabled in a deployment with provisioned secrets.
wms.security.jwt.enabled=${WMS_JWT_ENABLED:false}
# JWT signing and verification material is supplied only by deployment secrets.
wms.security.jwt.issuer=${WMS_JWT_ISSUER}
wms.security.jwt.tenant-selection-audience=${WMS_JWT_SELECTION_AUDIENCE}
wms.security.jwt.access-audience=${WMS_JWT_ACCESS_AUDIENCE}
wms.security.jwt.key-id=${WMS_JWT_KEY_ID}
wms.security.jwt.public-key-pem=${WMS_JWT_PUBLIC_KEY_PEM}
wms.security.jwt.private-key-pem=${WMS_JWT_PRIVATE_KEY_PEM}

# Encrypted WMS identity-email delivery is disabled unless explicitly enabled.
# SMTP credentials and public action URL must come from deployment secrets/configuration.
wms.identity.email.delivery.enabled=${WMS_EMAIL_DELIVERY_ENABLED:false}
wms.identity.email.delivery.smtp-host=${WMS_SMTP_HOST:}
wms.identity.email.delivery.smtp-port=${WMS_SMTP_PORT:587}
wms.identity.email.delivery.smtp-username=${WMS_SMTP_USERNAME:}
wms.identity.email.delivery.smtp-password=${WMS_SMTP_PASSWORD:}
wms.identity.email.delivery.from-address=${WMS_EMAIL_FROM:}
wms.identity.email.delivery.action-base-url=${WMS_PUBLIC_ACTION_BASE_URL:}
wms.identity.email.delivery.invitation-path=${WMS_EMAIL_INVITATION_PATH:/accept-invitation}
wms.identity.email.delivery.verification-path=${WMS_EMAIL_VERIFICATION_PATH:/verify-email}
wms.identity.email.delivery.password-reset-path=${WMS_EMAIL_PASSWORD_RESET_PATH:/reset-password}
wms.identity.email.delivery.poll-interval-ms=${WMS_EMAIL_POLL_INTERVAL_MS:5000}
wms.identity.email.delivery.max-messages-per-poll=${WMS_EMAIL_MAX_MESSAGES_PER_POLL:10}
wms.identity.email.delivery.max-attempts=${WMS_EMAIL_MAX_ATTEMPTS:8}
wms.identity.email.delivery.retry-base-delay=${WMS_EMAIL_RETRY_BASE_DELAY:30s}
wms.identity.email.delivery.retry-max-delay=${WMS_EMAIL_RETRY_MAX_DELAY:1h}
wms.identity.email.delivery.processing-lease=${WMS_EMAIL_PROCESSING_LEASE:2m}
wms.identity.email.delivery.smtp-connection-timeout-ms=${WMS_SMTP_CONNECTION_TIMEOUT_MS:5000}
wms.identity.email.delivery.smtp-read-timeout-ms=${WMS_SMTP_READ_TIMEOUT_MS:10000}
wms.identity.email.delivery.smtp-write-timeout-ms=${WMS_SMTP_WRITE_TIMEOUT_MS:10000}
